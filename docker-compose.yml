services:
  # Бекенд сервис AnatomyFit (Fastify + SQLite)
  api:
    image: anatomyfit-api:latest # образ можно собрать локально и загрузить на сервер (docker save | ssh ... docker load)
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: anatomyfit_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_PATH=/app/data/anatomyfit.sqlite
      - UPLOAD_DIR=/app/uploads
      # Обязателен: контейнер не запустится без секрета (минимум 32 символа, задаётся в .env рядом с docker-compose.yml)
      - JWT_SECRET=${JWT_SECRET:?Задайте JWT_SECRET (минимум 32 символа) в .env}
      - TRUST_PROXY=true
      # Точный origin сайта вместе с портом, например https://fit.example.com:8443
      - CORS_ORIGIN=${CORS_ORIGIN:?Задайте CORS_ORIGIN (origin сайта, например https://fit.example.com) в .env}
    volumes:
      # Постоянное хранилище базы SQLite и медиафайлов на хосте VPS
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
    # Порт API не публикуется на хост: доступ только через Caddy (/api/*) по внутренней сети compose
    expose:
      - "3001"

  # Caddy веб-сервер (Раздача статики PWA + автоматический бесплатный SSL Let's Encrypt + Reverse Proxy)
  caddy:
    image: caddy:alpine
    container_name: anatomyfit_caddy
    restart: unless-stopped
    environment:
      # SITE_ADDRESS: домен (с портом, если HTTPS не на 443), TLS_ISSUER: internal (самоподписанный) или acme (Let's Encrypt)
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
      - TLS_ISSUER=${TLS_ISSUER:-internal}
    ports:
      - "80:80" # HTTP-01 проверка Let's Encrypt и редирект на HTTPS
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv:ro
      - ./server/uploads:/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
